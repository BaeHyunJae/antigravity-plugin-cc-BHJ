name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests (no external deps, no auth needed)
        run: node --test tests/*.test.mjs

  validate-manifests:
    name: validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code (for manifest validation)
        run: npm install -g @anthropic-ai/claude-code

      # --strict fails on unrecognized fields and missing metadata that the runtime
      # would otherwise tolerate, which is what catches a typo before it ships.
      - name: Validate manifests against the Claude Code schema
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/antigravity --strict

      - name: Check every command/agent/skill file has YAML frontmatter
        run: |
          fail=0
          for f in plugins/antigravity/commands/*.md plugins/antigravity/agents/*.md $(find plugins/antigravity/skills -name SKILL.md); do
            head -1 "$f" | grep -q '^---$' || { echo "MISSING frontmatter: $f"; fail=1; }
          done
          exit $fail

      # agy is not installed on the runner; the generator exits 0 in --check mode when
      # it cannot find the binary, so this only bites when someone hand-edits a
      # generated block on a machine that does have agy.
      - name: Check the generated CLI reference is in sync
        run: npm run gen:cli-ref -- --check
